<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great War — A Song of Ice and Fire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #06080d;
    --gold: #c5a059;
    --gold-light: #e5c178;
    --ice: #4fb3ff;
    --fire: #ff4520;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-dark);
    color: #e2e8f0;
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Atmospheric Ambient Glow Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(79, 179, 255, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, rgba(255, 69, 32, 0.12) 0%, transparent 50%),
      radial-gradient(circle at 50% 80%, rgba(197, 160, 89, 0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 480px;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .sigil {
    font-size: 42px;
    letter-spacing: 14px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 16px rgba(197, 160, 89, 0.4));
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: clamp(1.8em, 6vw, 2.5em);
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 36px;
    text-shadow: 0 0 24px rgba(197, 160, 89, 0.3);
    text-transform: uppercase;
  }

  /* Buttons */
  .button-group {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .portal-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 22px 28px;
    border-radius: 16px;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: clamp(14px, 3.5vw, 16px);
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #ffffff;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
  }

  .portal-btn:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .portal-btn:active {
    transform: translateY(0) scale(0.98);
  }

  .portal-btn.ar-btn {
    background: radial-gradient(circle at center, rgba(255, 69, 32, 0.25) 0%, rgba(30, 10, 10, 0.9) 100%);
    border: 2px solid rgba(255, 69, 32, 0.6);
  }

  .portal-btn.ar-btn:hover {
    border-color: rgba(255, 69, 32, 1);
    box-shadow: 0 12px 35px rgba(255, 69, 32, 0.35);
  }

  .portal-btn.dashboard-btn {
    background: radial-gradient(circle at center, rgba(79, 179, 255, 0.25) 0%, rgba(10, 20, 32, 0.9) 100%);
    border: 2px solid rgba(79, 179, 255, 0.6);
  }

  .portal-btn.dashboard-btn:hover {
    border-color: rgba(79, 179, 255, 1);
    box-shadow: 0 12px 35px rgba(79, 179, 255, 0.35);
  }

  .btn-icon {
    font-size: 24px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="sigil">🐉⚔️🐉</div>
  <h1>The Great War</h1>

  <div class="button-group">
    <a href="./ar/" class="portal-btn ar-btn">
      <span class="btn-icon">⚔️</span>
      <span>Enter AR Battlefield</span>
    </a>

    <a href="./dashboard/" class="portal-btn dashboard-btn">
      <span class="btn-icon">🏰</span>
      <span>Realm Dashboard</span>
    </a>
  </div>
</div>

</body>
</html>
