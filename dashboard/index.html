<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Will Take the Iron Throne? — Live Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --gold: #d7b97e;
    --gold-dim: #9a8253;
    --gold-light: #e5c178;
    --ice: #4fb3ff;
    --fire: #ff4520;
    --ice-glow: rgba(79,179,255,0.5);
    --fire-glow: rgba(255,69,32,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Fullscreen particle FX canvas */
  #fx-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99;
  }

  /* Screen shake animation */
  .screen-shake {
    animation: shakeAnim 0.8s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10%, 30%, 50%, 70%, 90% { transform: translate(-6px, 4px) rotate(-0.5deg); }
    20%, 40%, 60%, 80% { transform: translate(6px, -4px) rotate(0.5deg); }
  }

  /* Blinding flash overlay */
  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.1s ease-out;
  }
  #flash-overlay.flash {
    opacity: 0.85;
    transition: opacity 0.8s ease-out;
  }
  #flash-overlay.flash-ice {
    background: radial-gradient(circle, #c8e8ff 0%, #4fb3ff 60%, transparent 100%);
  }
  #flash-overlay.flash-fire {
    background: radial-gradient(circle, #ffeedd 0%, #ff4520 60%, transparent 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    padding: 36px 20px;
    text-align: center;
  }

  .got-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.6em, 5vw, 2.5em);
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    line-height: 1.25;
    margin-bottom: 6px;
    text-shadow: 0 0 25px rgba(215, 185, 126, 0.3);
  }

  span.o-char {
    display: inline-block;
    position: relative;
  }
  span.o-char::after {
    content: '';
    position: absolute;
    top: 15%;
    bottom: 15%;
    left: 50%;
    width: 2px;
    background: var(--gold);
    transform: translateX(-50%);
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9a8f7a;
    margin-bottom: 36px;
  }

  /* Score Panels */
  .scores {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .score-card {
    flex: 1;
    max-width: 230px;
    padding: 26px 16px;
    border-radius: 20px;
    background: rgba(10, 10, 12, 0.9);
    border: 1px solid rgba(215, 185, 126, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .score-card.ice.active {
    box-shadow: 0 0 35px var(--ice-glow);
    border-color: rgba(79,179,255,0.7);
    transform: translateY(-3px);
  }
  .score-card.fire.active {
    box-shadow: 0 0 35px var(--fire-glow);
    border-color: rgba(255,69,32,0.7);
    transform: translateY(-3px);
  }

  .score-card .team-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 90px;
    margin-bottom: 8px;
  }
  .score-card .dash-flame {
    width: 65px;
    height: 90px;
    object-fit: contain;
    mix-blend-mode: screen;
    transition: transform 0.3s ease;
  }
  .score-card.fire .dash-flame {
    filter: drop-shadow(0 0 16px rgba(255, 69, 32, 0.8));
    animation: flameFloatFire 3.5s ease-in-out infinite alternate;
  }
  .score-card.ice .dash-flame {
    filter: drop-shadow(0 0 16px rgba(79, 179, 255, 0.8));
    animation: flameFloatIce 3.5s ease-in-out infinite alternate;
  }
  @keyframes flameFloatFire {
    from { transform: translateY(0); }
    to { transform: translateY(-6px) scale(1.04); }
  }
  @keyframes flameFloatIce {
    from { transform: translateY(0); }
    to { transform: translateY(-6px) scale(1.04); }
  }
  .score-card .team-name {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8c8270;
    margin-bottom: 4px;
  }
  .score-card .leader-name {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }
  .score-card.ice .leader-name { color: var(--ice); }
  .score-card.fire .leader-name { color: var(--fire); }

  .score-card .count {
    font-family: 'Cinzel', serif;
    font-size: 54px;
    font-weight: 900;
    line-height: 1;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .score-card.ice .count { color: var(--ice); text-shadow: 0 0 20px var(--ice-glow); }
  .score-card.fire .count { color: var(--fire); text-shadow: 0 0 20px var(--fire-glow); }

  .score-card .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #706858;
    margin-top: 6px;
  }

  /* Glacial Ice Throne Button */
  .throne-btn {
    display: inline-block;
    padding: 16px 38px;
    border: 1.5px solid rgba(160, 225, 255, 0.7);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(160, 230, 255, 0.2) 0%, rgba(30, 95, 165, 0.35) 50%, rgba(8, 24, 48, 0.8) 100%);
    color: #e2f4ff;
    font-family: 'Cinzel', serif;
    font-size: clamp(12px, 2.5vw, 14px);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 28px;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 20px rgba(79, 179, 255, 0.35), inset 0 0 12px rgba(180, 235, 255, 0.25);
    text-shadow: 0 0 10px rgba(140, 215, 255, 0.8);
    position: relative;
    overflow: hidden;
    transform: translateZ(0);
  }
  .throne-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }
  .throne-btn:hover:not(:disabled) {
    border-color: #ffffff;
    color: #ffffff;
    background: linear-gradient(135deg, rgba(255, 120, 50, 0.25) 0%, rgba(79, 179, 255, 0.45) 50%, rgba(15, 40, 75, 0.85) 100%);
    box-shadow: 0 0 35px rgba(79, 179, 255, 0.8), 0 0 25px rgba(255, 69, 32, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.5);
    transform: scale(1.03);
    text-shadow: 0 0 14px #ffffff, 0 0 25px rgba(79, 179, 255, 0.9);
  }
  .throne-btn:hover:not(:disabled)::before {
    transform: translateX(100%);
  }
  .throne-btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .throne-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    border-color: rgba(160, 225, 255, 0.2);
    box-shadow: none;
  }

  /* Result Reveal */
  .result {
    display: none;
    padding: 32px 20px;
    border-radius: 18px;
    background: rgba(8, 8, 10, 0.95);
    border: 1px solid rgba(215, 185, 126, 0.3);
    backdrop-filter: blur(14px);
    position: relative;
  }
  .result.show {
    display: block;
    animation: revealDramatic 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes revealDramatic {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.85);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .result .crown {
    font-size: 56px;
    margin-bottom: 10px;
    display: inline-block;
  }

  .result .winner-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2em, 3.8vw, 1.7em);
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .result.ice-wins .winner-title { color: var(--ice); text-shadow: 0 0 25px var(--ice-glow); }
  .result.fire-wins .winner-title { color: var(--fire); text-shadow: 0 0 25px var(--fire-glow); }
  .result.tie .winner-title { color: var(--gold); text-shadow: 0 0 25px rgba(215, 185, 126, 0.5); }

  .result.ice-wins { border-color: rgba(79,179,255,0.5); box-shadow: 0 0 50px var(--ice-glow); }
  .result.fire-wins { border-color: rgba(255,69,32,0.5); box-shadow: 0 0 50px var(--fire-glow); }
  .result.tie { border-color: rgba(215,185,126,0.5); box-shadow: 0 0 50px rgba(215,185,126,0.3); }

  .result .verdict {
    font-size: 13px;
    letter-spacing: 2px;
    color: #c9bca0;
    line-height: 1.6;
    margin-top: 8px;
  }

  /* Suspense Banner */
  #suspense-banner {
    display: none;
    font-family: 'Cinzel', serif;
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--gold-light);
    margin-bottom: 24px;
    animation: suspensePulse 0.4s infinite alternate;
  }
  @keyframes suspensePulse {
    from { opacity: 0.6; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1.02); }
  }

  /* Glacial Ice Home Button */
  .home-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border: 1.5px solid rgba(160, 225, 255, 0.6);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(160, 230, 255, 0.18) 0%, rgba(30, 95, 165, 0.3) 50%, rgba(8, 24, 48, 0.7) 100%);
    color: #e2f4ff;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(14px);
    box-shadow: 0 0 18px rgba(79, 179, 255, 0.3), inset 0 0 12px rgba(180, 235, 255, 0.2);
    text-shadow: 0 0 8px rgba(140, 215, 255, 0.8);
    z-index: 50;
  }
  .home-btn:hover {
    border-color: #ffffff;
    color: #ffffff;
    background: linear-gradient(135deg, rgba(255, 120, 50, 0.25) 0%, rgba(79, 179, 255, 0.45) 50%, rgba(15, 40, 75, 0.85) 100%);
    box-shadow: 0 0 30px rgba(79, 179, 255, 0.8), 0 0 20px rgba(255, 69, 32, 0.6);
    transform: scale(1.06);
    text-shadow: 0 0 12px #ffffff;
  }

  /* Connection Status */
  .status {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #60584a;
    transition: color 0.3s;
    white-space: nowrap;
    z-index: 10;
  }
  .status.connected { color: #3d9970; }
</style>
</head>
<body>

<a href="../" class="home-btn">&larr; H<span class="o-char">O</span>ME</a>

<canvas id="fx-canvas"></canvas>
<div id="flash-overlay"></div>

<div class="container" id="main-container">
  <h1 class="got-title">
    A S<span class="o-char">O</span>NG <span class="o-char">O</span>F<br>
    ICE AND FIRE
  </h1>
  <div class="subtitle">MATTER VS ANTIMATTER &middot; REALM BATTLE TRACKER</div>

  <div class="scores">
    <div class="score-card fire" id="fire-card">
      <div class="team-icon">
        <img src="assets/fire_flame.png" alt="Matter / Fire" class="dash-flame">
      </div>
      <div class="team-name">PLAYER 1 &middot; MATTER</div>
      <div class="leader-name">DAENERYS (FIRE)</div>
      <div class="count" id="fire-count">0</div>
      <div class="label">collected</div>
    </div>
    <div class="score-card ice" id="ice-card">
      <div class="team-icon">
        <img src="assets/ice_flame.png" alt="Antimatter / Ice" class="dash-flame">
      </div>
      <div class="team-name">PLAYER 2 &middot; ANTIMATTER</div>
      <div class="leader-name">NIGHT KING (ICE)</div>
      <div class="count" id="ice-count">0</div>
      <div class="label">collected</div>
    </div>
  </div>

  <div id="suspense-banner">⚔️ SUMMONING THE IRON THRONE... ⚔️</div>

  <button class="throne-btn" id="throne-btn" disabled>
    ⚔️ WHO WILL TAKE THE IRON THRONE? ⚔️
  </button>

  <div class="result" id="result">
    <div class="crown" id="result-crown"></div>
    <div class="winner-title" id="result-title"></div>
    <div class="verdict" id="result-verdict"></div>
  </div>
</div>

<div class="status" id="status">connecting to realm…</div>

<script>
(()=>{
  const iceCountEl = document.getElementById('ice-count')
  const fireCountEl = document.getElementById('fire-count')
  const iceCard = document.getElementById('ice-card')
  const fireCard = document.getElementById('fire-card')
  const throneBtn = document.getElementById('throne-btn')
  const resultEl = document.getElementById('result')
  const resultCrown = document.getElementById('result-crown')
  const resultTitle = document.getElementById('result-title')
  const resultVerdict = document.getElementById('result-verdict')
  const statusEl = document.getElementById('status')
  const mainContainer = document.getElementById('main-container')
  const flashOverlay = document.getElementById('flash-overlay')
  const suspenseBanner = document.getElementById('suspense-banner')
  const fxCanvas = document.getElementById('fx-canvas')
  const ctx = fxCanvas.getContext('2d')

  let iceScore = 0
  let fireScore = 0
  let particles = []
  let animId = null

  // Resize particle canvas
  const resizeCanvas = () => {
    fxCanvas.width = window.innerWidth
    fxCanvas.height = window.innerHeight
  }
  window.addEventListener('resize', resizeCanvas)
  resizeCanvas()

  // Audio: Official Game of Thrones Theme Track
  const themeAudio = new Audio('assets/got-theme.mp3')
  themeAudio.preload = 'auto'
  themeAudio.volume = 1.0

  const playGotThemeAudio = () => {
    try {
      themeAudio.currentTime = 0
      const playPromise = themeAudio.play()
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log('Audio playback waiting for user gesture or loading:', err)
        })
      }
    } catch(e) {
      console.error('Audio play error:', e)
    }
  }

  // Particle explosion logic
  const spawnParticles = (type) => {
    const cx = window.innerWidth / 2
    const cy = window.innerHeight / 2
    particles = []

    const count = 180
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2
      const speed = 2 + Math.random() * 12
      const size = 3 + Math.random() * 8
      const life = 60 + Math.random() * 60

      let color
      if (type === 'ice') {
        const blues = ['#4fb3ff', '#a0dcff', '#ffffff', '#70c5ff', '#1f70b0']
        color = blues[Math.floor(Math.random() * blues.length)]
      } else if (type === 'fire') {
        const reds = ['#ff4520', '#ff825a', '#ffcc00', '#ffffff', '#d43000']
        color = reds[Math.floor(Math.random() * reds.length)]
      } else {
        const golds = ['#c5a059', '#e5c178', '#4fb3ff', '#ff4520', '#ffffff']
        color = golds[Math.floor(Math.random() * golds.length)]
      }

      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (type === 'fire' ? 1.5 : 0),
        size,
        color,
        life,
        maxLife: life,
        spin: (Math.random() - 0.5) * 0.2
      })
    }

    if (!animId) loopParticles()
  }

  const loopParticles = () => {
    ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height)
    let alive = 0

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i]
      if (p.life > 0) {
        p.x += p.vx
        p.y += p.vy
        p.vx *= 0.98
        p.vy *= 0.98
        p.life--
        const alpha = p.life / p.maxLife

        ctx.save()
        ctx.globalAlpha = alpha
        ctx.fillStyle = p.color
        ctx.shadowColor = p.color
        ctx.shadowBlur = 10

        ctx.beginPath()
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2)
        ctx.fill()
        ctx.restore()

        alive++
      }
    }

    if (alive > 0) {
      animId = requestAnimationFrame(loopParticles)
    } else {
      animId = null
      ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height)
    }
  }

  const updateScores = (ice, fire) => {
    iceScore = ice
    iceCountEl.textContent = ice
    if (ice > 0) {
      iceCard.classList.add('active')
    } else {
      iceCard.classList.remove('active')
    }

    fireScore = fire
    fireCountEl.textContent = fire
    if (fire > 0) {
      fireCard.classList.add('active')
    } else {
      fireCard.classList.remove('active')
    }

    // Enable button when at least one team has scored
    throneBtn.disabled = !(iceScore > 0 || fireScore > 0)
  }

  throneBtn.addEventListener('click', () => {
    const finalIce = iceScore
    const finalFire = fireScore
    const winnerType = finalIce > finalFire ? 'ice' : (finalFire > finalIce ? 'fire' : 'tie')

    // 1. Play official Game of Thrones theme track directly
    playGotThemeAudio()

    // 2. Trigger screen shake
    document.body.classList.remove('screen-shake')
    void document.body.offsetWidth // reflow
    document.body.classList.add('screen-shake')

    // 3. Trigger flash overlay
    flashOverlay.className = `flash flash-${winnerType}`
    setTimeout(() => { flashOverlay.className = '' }, 500)

    // 4. Trigger particle explosion
    spawnParticles(winnerType)

    // 5. Hide button & show suspense teaser banner
    throneBtn.style.display = 'none'
    suspenseBanner.style.display = 'block'
    resultEl.classList.remove('show', 'ice-wins', 'fire-wins', 'tie')

    // 6. Reveal victor after 1 second of dramatic suspense
    setTimeout(() => {
      suspenseBanner.style.display = 'none'
      throneBtn.style.display = 'inline-block'

      if (winnerType === 'ice') {
        resultEl.classList.add('show', 'ice-wins')
        resultCrown.innerHTML = '<img src="assets/ice_flame.png" style="width:75px;height:105px;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 25px rgba(79,179,255,0.9));">'
        resultTitle.textContent = 'THE NIGHT KING TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Viserion's icy blizzard freezes the realm.<br>Ice ${finalIce} — Fire ${finalFire}`
      } else if (winnerType === 'fire') {
        resultEl.classList.add('show', 'fire-wins')
        resultCrown.innerHTML = '<img src="assets/fire_flame.png" style="width:75px;height:105px;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 25px rgba(255,69,32,0.9));">'
        resultTitle.textContent = 'DAENERYS TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Drogon's inferno melts the Iron Throne and creates a new dynasty.<br>Fire ${finalFire} — Ice ${finalIce}`
      } else {
        resultEl.classList.add('show', 'tie')
        resultCrown.innerHTML = '<img src="assets/yinyang.png" style="width:85px;height:85px;object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 0 25px rgba(215,185,126,0.9));">'
        resultTitle.textContent = 'NO ONE TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Ice and Fire have clashed to an exact standstill.<br>Ice ${finalIce} — Fire ${finalFire}<br><span style="color:var(--gold);font-weight:700;letter-spacing:1.5px;display:inline-block;margin-top:6px">THE IRON THRONE STANDS EMPTY</span>`
      }

      // Reset counters to zero immediately
      updateScores(0, 0)

      // Notify relay server to reset all stored scores to zero for the next battle
      try {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'reset' }))
        }
        fetch(`${httpRelay}/reset?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          mode: 'cors'
        }).catch(() => {})
      } catch(e) {}
    }, 1000)
  })

  // WebSocket auto-connect
  const params = new URLSearchParams(window.location.search)
  const relay = params.get('relay') || 'wss://score-relay.iceandfire.workers.dev'
  const room = params.get('room') || 'quantum1'

  let socket = null

  const connect = () => {
    const url = `${relay}/ws?room=${encodeURIComponent(room)}&name=dashboard&role=viewer`
    socket = new WebSocket(url)

    socket.addEventListener('open', () => {
      statusEl.textContent = `connected · room "${room}"`
      statusEl.className = 'status connected'
    })

    socket.addEventListener('close', () => {
      statusEl.textContent = 'disconnected · reconnecting…'
      statusEl.className = 'status'
      setTimeout(connect, 2000)
    })

    socket.addEventListener('error', () => {
      socket.close()
    })

    socket.addEventListener('message', (event) => {
      try {
        const msg = JSON.parse(event.data)
        console.log('WS received:', msg)

        // Handle relay broadcast format: {type:"state", scores: {Ice: {ice, fire}, Fire: {ice, fire}}}
        if (msg.type === 'state' && msg.scores) {
          let totalIce = 0, totalFire = 0
          Object.values(msg.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }

        // Handle relay broadcast format: {type:"state", players:[{name, ice, fire, total}]}
        if (msg.type === 'state' && msg.players) {
          let totalIce = 0, totalFire = 0
          msg.players.forEach(p => {
            totalIce += (p.ice || 0)
            totalFire += (p.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }

        // Handle direct player score: {type:"score", name:"Ice"/"Fire", ice:N, fire:N}
        if (msg.type === 'score') {
          updateScores(msg.ice || 0, msg.fire || 0)
        }

        // Handle any message with ice/fire fields (catch-all)
        if (typeof msg.ice === 'number' || typeof msg.fire === 'number') {
          updateScores(msg.ice || 0, msg.fire || 0)
        }
      } catch(e) {
        console.error('bad message', e)
      }
    })
  }

  connect()

  // 1-second background state polling fallback (guarantees real-time sync with 0 page refreshes)
  const httpRelay = relay.replace(/^ws:/, 'http:').replace(/^wss:/, 'https:')
  const pollState = async () => {
    try {
      const res = await fetch(`${httpRelay}/state?room=${encodeURIComponent(room)}`)
      if (res.ok) {
        const data = await res.json()
        if (data && data.scores) {
          let totalIce = 0, totalFire = 0
          Object.values(data.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }
      }
    } catch(e) {}
  }
  setInterval(pollState, 1000)
  pollState()
})()
</script>
