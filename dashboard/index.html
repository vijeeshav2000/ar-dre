<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>A Song of Ice and Fire — Live Realm Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Trajan';
    src: url('assets/Trajan Regular.ttf?v=11') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --gold: #d7b97e;
    --ice: #00b4ff;
    --fire: #ff6000;
    --silver-text: #d4d8dc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000000;
    color: #e2e8f0;
    font-family: 'Trajan', 'Cinzel', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
  }

  /* Atmospheric Mountain Landscape Background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(ellipse at 15% 25%, rgba(30, 95, 170, 0.22) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 25%, rgba(185, 75, 20, 0.22) 0%, transparent 55%),
      linear-gradient(to bottom, rgba(2, 4, 6, 0.5) 0%, rgba(5, 8, 14, 0.35) 40%, rgba(2, 4, 6, 0.75) 100%),
      url('assets/mountain_bg.jpg?v=11');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    transform: scaleX(-1);
    pointer-events: none;
    z-index: 0;
  }

  /* Fullscreen particle FX canvas */
  #fx-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99;
  }

  /* Screen shake animation */
  .screen-shake {
    animation: shakeAnim 0.8s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10%, 30%, 50%, 70%, 90% { transform: translate(-6px, 4px) rotate(-0.5deg); }
    20%, 40%, 60%, 80% { transform: translate(6px, -4px) rotate(0.5deg); }
  }

  /* Blinding flash overlay */
  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.1s ease-out;
  }
  #flash-overlay.flash {
    opacity: 0.85;
    transition: opacity 0.8s ease-out;
  }
  #flash-overlay.flash-ice {
    background: radial-gradient(circle, #c8e8ff 0%, #00b4ff 60%, transparent 100%);
  }
  #flash-overlay.flash-fire {
    background: radial-gradient(circle, #ffeedd 0%, #ff6000 60%, transparent 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: 30px 20px;
    text-align: center;
    transition: opacity 0.5s ease;
  }

  /* Title Matching Reference Screenshot */
  .title-intro {
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: clamp(1.8rem, 4.8vw, 3rem);
    letter-spacing: 5px;
    line-height: 1.35;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .title-intro .sub-line {
    font-size: 0.6em;
    letter-spacing: 6px;
    margin-bottom: 4px;
    display: block;
  }
  .c-ice {
    color: #7ec2eb;
    text-shadow: 0 0 16px rgba(126, 194, 235, 0.4);
  }
  .c-fire {
    color: #e87834;
    text-shadow: 0 0 16px rgba(232, 120, 52, 0.4);
  }
  .c-silver {
    color: #d4d8dc;
  }

  /* Dashboard Scores Section */
  .dash-columns {
    display: flex;
    gap: clamp(30px, 8vw, 90px);
    justify-content: center;
    margin-bottom: 36px;
  }

  .player-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: clamp(140px, 26vw, 190px);
  }

  .column-flame {
    width: clamp(55px, 10vw, 75px);
    height: clamp(80px, 14vw, 110px);
    object-fit: contain;
    mix-blend-mode: screen;
    margin-bottom: 12px;
    animation: flameHover 3.5s ease-in-out infinite alternate;
  }
  .column-flame.ice {
    filter: drop-shadow(0 0 25px rgba(0, 180, 255, 0.8));
  }
  .column-flame.fire {
    filter: drop-shadow(0 0 25px rgba(255, 96, 0, 0.8));
    animation-delay: -1.8s;
  }
  @keyframes flameHover {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
  }

  /* Score Box Card */
  .score-box {
    width: 100%;
    height: clamp(150px, 24vw, 190px);
    border-radius: 28px;
    background: rgba(4, 8, 14, 0.65);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    border: 1.5px solid transparent;
  }
  .score-box.ice {
    border-color: rgba(0, 180, 255, 0.75);
    box-shadow: 0 0 25px rgba(0, 180, 255, 0.25);
  }
  .score-box.fire {
    border-color: rgba(255, 96, 0, 0.75);
    box-shadow: 0 0 25px rgba(255, 96, 0, 0.25);
  }

  .score-box .count {
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: clamp(48px, 9vw, 68px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .score-box.ice .count {
    color: #00b4ff;
    text-shadow: 0 0 25px rgba(0, 180, 255, 0.6);
  }
  .score-box.fire .count {
    color: #ff6000;
    text-shadow: 0 0 25px rgba(255, 96, 0, 0.6);
  }

  .score-box .label {
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #8a96a4;
  }

  /* Player Badge Pill below card */
  .player-pill-badge {
    margin-top: 16px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(4, 8, 14, 0.75);
    border: 1px solid transparent;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
  }
  .player-pill-badge.ice {
    border-color: rgba(0, 180, 255, 0.6);
  }
  .player-pill-badge.fire {
    border-color: rgba(255, 96, 0, 0.6);
  }

  .badge-title {
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .player-pill-badge.ice .badge-title { color: #7ec2eb; }
  .player-pill-badge.fire .badge-title { color: #e87834; }

  .badge-sub {
    font-size: 10px;
    letter-spacing: 2px;
    color: #8c96a0;
    text-transform: uppercase;
  }

  /* Claim Action Button */
  .throne-btn, .outcome-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 13px 42px;
    border-radius: 12px;
    background: rgba(6, 10, 16, 0.85);
    color: var(--silver-text);
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 18px rgba(0, 0, 0, 0.85);
    border: 1px solid transparent;
    background-image: linear-gradient(rgba(6, 10, 16, 0.85), rgba(6, 10, 16, 0.85)), 
                      linear-gradient(to right, rgba(126, 194, 235, 0.65), rgba(232, 120, 52, 0.65));
    background-origin: border-box;
    background-clip: padding-box, border-box;
    position: relative;
    overflow: hidden;
  }
  .throne-btn:hover, .outcome-btn:hover {
    color: #ffffff;
    transform: scale(1.04);
    box-shadow: 0 0 25px rgba(126, 194, 235, 0.5), 0 0 25px rgba(232, 120, 52, 0.5);
    background-image: linear-gradient(rgba(12, 18, 28, 0.95), rgba(12, 18, 28, 0.95)), 
                      linear-gradient(to right, rgba(126, 194, 235, 0.95), rgba(232, 120, 52, 0.95));
  }
  .throne-btn:active, .outcome-btn:active {
    transform: scale(0.97);
  }

  /* Fullscreen Outcome Viewport */
  #outcome-screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 200;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 30px 24px;
  }
  #outcome-screen.active {
    display: flex;
    opacity: 1;
  }

  .outcome-title {
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: clamp(2.2rem, 6vw, 4.4rem);
    letter-spacing: 6px;
    line-height: 1.25;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 35px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 255, 255, 0.3);
    margin-bottom: 32px;
    max-width: 900px;
  }

  .outcome-story-text {
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: clamp(1.05rem, 2.2vw, 1.4rem);
    line-height: 2.1;
    letter-spacing: 3px;
    color: #f0f4f8;
    max-width: 860px;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
    margin-bottom: 36px;
  }

  /* Suspense Banner */
  #suspense-banner {
    display: none;
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: #e5c178;
    text-transform: uppercase;
    margin-bottom: 18px;
    text-shadow: 0 0 15px rgba(229,193,120,0.6);
    animation: pulseBanner 0.6s ease-in-out infinite alternate;
  }
  @keyframes pulseBanner {
    from { opacity: 0.7; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1.02); }
  }

  /* Home Button */
  .home-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 12px;
    background: rgba(6, 10, 16, 0.75);
    color: #d4d8dc;
    font-family: 'Trajan', 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    border: 1px solid transparent;
    background-image: linear-gradient(rgba(6, 10, 16, 0.8), rgba(6, 10, 16, 0.8)), 
                      linear-gradient(to right, rgba(126, 194, 235, 0.6), rgba(232, 120, 52, 0.6));
    background-origin: border-box;
    background-clip: padding-box, border-box;
    z-index: 50;
  }
  .home-btn:hover {
    color: #ffffff;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(126, 194, 235, 0.4), 0 0 20px rgba(232, 120, 52, 0.4);
  }

  /* Connection Status */
  .status {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #60584a;
    transition: color 0.3s;
    white-space: nowrap;
    z-index: 10;
  }
  .status.connected { color: #3d9970; }
</style>
</head>
<body>

<a href="../" class="home-btn">&larr; HOME</a>

<canvas id="fx-canvas"></canvas>
<div id="flash-overlay"></div>

<div class="container" id="main-container">
  <h1 class="title-intro">
    <span class="sub-line"><span class="c-ice">A SONG</span> <span class="c-fire">OF</span></span>
    <span class="c-ice">ICE</span> <span class="c-silver">AND</span> <span class="c-fire">FIRE</span>
  </h1>

  <div class="dash-columns">
    <!-- PLAYER 1 · ICE COLUMN -->
    <div class="player-column">
      <img src="assets/ice_flame.png?v=11" alt="Ice Flame" class="column-flame ice">
      <div class="score-box ice" id="ice-card">
        <div class="count" id="ice-count">00</div>
        <div class="label">COLLECTED</div>
      </div>
      <div class="player-pill-badge ice">
        <div class="badge-title">PLAYER 1</div>
        <div class="badge-sub">ICE</div>
      </div>
    </div>

    <!-- PLAYER 2 · FIRE COLUMN -->
    <div class="player-column">
      <img src="assets/fire_flame.png?v=11" alt="Fire Flame" class="column-flame fire">
      <div class="score-box fire" id="fire-card">
        <div class="count" id="fire-count">00</div>
        <div class="label">COLLECTED</div>
      </div>
      <div class="player-pill-badge fire">
        <div class="badge-title">PLAYER 2</div>
        <div class="badge-sub">FIRE</div>
      </div>
    </div>
  </div>

  <div id="suspense-banner">⚔️ SUMMONING THE IRON THRONE... ⚔️</div>

  <button class="throne-btn" id="throne-btn">CLAIM</button>
</div>

<!-- Fullscreen Outcome Screen Container -->
<div id="outcome-screen">
  <div id="outcome-stage-1" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <h1 class="outcome-title" id="outcome-claim-title">ICE CLAIMS<br>THE THRONE</h1>
    <button class="outcome-btn" id="outcome-see-more-btn">SEE MORE</button>
  </div>

  <div id="outcome-stage-2" style="display: none; flex-direction: column; align-items: center; justify-content: center;">
    <p class="outcome-story-text" id="outcome-story-content"></p>
    <a href="../" class="outcome-btn">HOME</a>
  </div>
</div>

<div class="status" id="status">CONNECTING TO REALM RELAY...</div>

<script>
// --- Fullscreen Particle FX Engine ---
const canvas = document.getElementById('fx-canvas')
const ctx = canvas.getContext('2d')
let width = (canvas.width = window.innerWidth)
let height = (canvas.height = window.innerHeight)

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth
  height = canvas.height = window.innerHeight
})

const fxParticles = []

class FxParticle {
  constructor(x, y, color, speed, size, life) {
    this.x = x
    this.y = y
    this.color = color
    this.vx = (Math.random() - 0.5) * speed
    this.vy = (Math.random() - 0.5) * speed - (Math.random() * 2)
    this.size = size || Math.random() * 4 + 2
    this.life = life || 1
    this.maxLife = this.life
    this.alpha = 1
  }
  update() {
    this.x += this.vx
    this.y += this.vy
    this.vy += 0.05
    this.life -= 0.015
    this.alpha = Math.max(0, this.life / this.maxLife)
    this.size *= 0.985
  }
  draw() {
    ctx.save()
    ctx.globalAlpha = this.alpha
    ctx.fillStyle = this.color
    ctx.shadowColor = this.color
    ctx.shadowBlur = 10
    ctx.beginPath()
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2)
    ctx.fill()
    ctx.restore()
  }
}

function spawnExplosion(x, y, team, count = 100) {
  const colors = team === 'ice'
    ? ['#c8e8ff', '#4fb3ff', '#1e5fa5', '#ffffff', '#8cd7ff']
    : ['#ffeedd', '#ff4520', '#ff8c00', '#ffffff', '#ffd700']
  for (let i = 0; i < count; i++) {
    const color = colors[Math.floor(Math.random() * colors.length)]
    fxParticles.push(new FxParticle(x, y, color, Math.random() * 12 + 4, Math.random() * 5 + 2, Math.random() * 1.5 + 0.5))
  }
}

function renderFx() {
  ctx.clearRect(0, 0, width, height)
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles[i]
    p.update()
    p.draw()
    if (p.life <= 0 || p.size <= 0.5) {
      fxParticles.splice(i, 1)
    }
  }
  requestAnimationFrame(renderFx)
}
renderFx()

// Audio Controller: Pure GoT Theme Song playback
class GotAudioController {
  constructor() {
    this.bgm = new Audio('https://ia800109.us.archive.org/20/items/GameOfThronesTheme_201608/GameOfThronesTheme.mp3')
    this.bgm.volume = 0.8
    this.bgm.preload = 'auto'
  }
  playThroneMusic() {
    try {
      this.bgm.currentTime = 0
      this.bgm.play().catch(e => console.log('Audio autoplay prevented:', e))
    } catch(e) {}
  }
}
const audioController = new GotAudioController()

// --- Realm Dashboard Logic ---
(() => {
  const iceCountEl = document.getElementById('ice-count')
  const fireCountEl = document.getElementById('fire-count')
  const iceCard = document.getElementById('ice-card')
  const fireCard = document.getElementById('fire-card')
  const throneBtn = document.getElementById('throne-btn')
  const statusEl = document.getElementById('status')
  const suspenseBanner = document.getElementById('suspense-banner')
  const flashOverlay = document.getElementById('flash-overlay')
  const mainContainer = document.getElementById('main-container')

  const outcomeScreen = document.getElementById('outcome-screen')
  const outcomeStage1 = document.getElementById('outcome-stage-1')
  const outcomeStage2 = document.getElementById('outcome-stage-2')
  const outcomeClaimTitle = document.getElementById('outcome-claim-title')
  const outcomeSeeMoreBtn = document.getElementById('outcome-see-more-btn')
  const outcomeStoryContent = document.getElementById('outcome-story-content')

  let currentIce = 0
  let currentFire = 0
  let currentWinner = 'ice'

  const formatDigits = (n) => String(n).padStart(2, '0')

  function updateScores(ice, fire) {
    if (ice !== currentIce) {
      currentIce = ice
      iceCountEl.textContent = formatDigits(ice)
      iceCountEl.style.transform = 'scale(1.15)'
      setTimeout(() => { iceCountEl.style.transform = 'scale(1)' }, 200)
    }
    if (fire !== currentFire) {
      currentFire = fire
      fireCountEl.textContent = formatDigits(fire)
      fireCountEl.style.transform = 'scale(1.15)'
      setTimeout(() => { fireCountEl.style.transform = 'scale(1)' }, 200)
    }

    if (currentIce > currentFire) {
      iceCard.style.boxShadow = '0 0 35px rgba(0, 180, 255, 0.5)'
      fireCard.style.boxShadow = '0 0 15px rgba(0, 0, 0, 0.8)'
    } else if (currentFire > currentIce) {
      fireCard.style.boxShadow = '0 0 35px rgba(255, 96, 0, 0.5)'
      iceCard.style.boxShadow = '0 0 15px rgba(0, 0, 0, 0.8)'
    } else {
      iceCard.style.boxShadow = '0 0 20px rgba(0, 180, 255, 0.25)'
      fireCard.style.boxShadow = '0 0 20px rgba(255, 96, 0, 0.25)'
    }
  }

  function revealWinner() {
    throneBtn.style.display = 'none'
    suspenseBanner.style.display = 'block'
    mainContainer.classList.add('screen-shake')
    setTimeout(() => { mainContainer.classList.remove('screen-shake') }, 800)

    audioController.playThroneMusic()

    currentWinner = currentIce >= currentFire ? 'ice' : 'fire'
    const centerX = window.innerWidth / 2
    const centerY = window.innerHeight / 2

    flashOverlay.className = currentWinner === 'ice' ? 'flash flash-ice' : 'flash flash-fire'
    setTimeout(() => { flashOverlay.className = '' }, 800)

    spawnExplosion(centerX, centerY, currentWinner, 150)

    setTimeout(() => {
      suspenseBanner.style.display = 'none'
      mainContainer.style.opacity = '0'

      if (currentWinner === 'ice') {
        outcomeScreen.style.backgroundImage = "url('assets/outcome_ice_dragon.jpg?v=11')"
        outcomeClaimTitle.innerHTML = 'ICE CLAIMS<br>THE THRONE'
      } else {
        outcomeScreen.style.backgroundImage = "url('assets/outcome_fire_dragon.jpg?v=11')"
        outcomeClaimTitle.innerHTML = 'FIRE CLAIMS<br>THE THRONE'
      }

      outcomeStage1.style.display = 'flex'
      outcomeStage2.style.display = 'none'
      outcomeScreen.classList.add('active')
    }, 1000)
  }

  outcomeSeeMoreBtn.addEventListener('click', () => {
    outcomeStage1.style.display = 'none'
    outcomeStage2.style.display = 'flex'

    if (currentWinner === 'ice') {
      outcomeScreen.style.backgroundImage = "url('assets/outcome_ice_galaxy.jpg?v=11')"
      outcomeStoryContent.innerHTML = 
        "ICE PREVAILED. ANTIMATTER SURVIVED INSTEAD OF<br>" +
        "MATTER &mdash; A MIRROR UNIVERSE, IDENTICAL IN EVERY<br>" +
        "LAW, OPPOSITE IN EVERY ATOM. SOMEWHERE IN THE<br>" +
        "MATHEMATICS, THIS WORLD EXISTS TOO."
    } else {
      outcomeScreen.style.backgroundImage = "url('assets/outcome_fire_galaxy.jpg?v=11')"
      outcomeStoryContent.innerHTML = 
        "FIRE PREVAILED. MATTER SURVIVED THE COLLISION &mdash;<br>" +
        "THE SAME IMBALANCE THAT BUILT STARS, PLANETS, AND<br>" +
        "EVERY LIVING THING. YOU ARE PROOF THAT FIRE WON,<br>" +
        "ONCE, AT THE BEGINNING OF EVERYTHING."
    }
  })

  throneBtn.addEventListener('click', () => {
    revealWinner()
  })

  // --- WebSocket Live Connection ---
  const WORKER_HOST = 'got-ar-backend.dr-e-backend.workers.dev'
  let ws = null
  let reconnectTimer = null

  function connectWS() {
    try {
      ws = new WebSocket('wss://' + WORKER_HOST + '/ws?role=dashboard')

      ws.onopen = () => {
        statusEl.textContent = 'REALM LIVE &middot; TRACKING SCORES'
        statusEl.classList.add('connected')
        if (reconnectTimer) clearTimeout(reconnectTimer)
      }

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data)
          if (msg.type === 'state' && msg.data) {
            let totalIce = 0
            let totalFire = 0
            if (msg.data.scores) {
              Object.values(msg.data.scores).forEach(s => {
                totalIce += (s.ice || 0)
                totalFire += (s.fire || 0)
              })
            }
            updateScores(totalIce, totalFire)
          }
        } catch(e) {}
      }

      ws.onclose = () => {
        statusEl.textContent = 'RECONNECTING TO REALM RELAY...'
        statusEl.classList.remove('connected')
        reconnectTimer = setTimeout(connectWS, 3000)
      }

      ws.onerror = () => {
        try { ws.close() } catch(e) {}
      }
    } catch(e) {
      reconnectTimer = setTimeout(connectWS, 3000)
    }
  }
  connectWS()

  // Fallback Polling
  async function pollState() {
    try {
      const res = await fetch('https://' + WORKER_HOST + '/state')
      if (res.ok) {
        const data = await res.json()
        if (data && data.scores) {
          let totalIce = 0
          let totalFire = 0
          Object.values(data.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }
      }
    } catch(e) {}
  }
  setInterval(pollState, 1000)
  pollState()
})()
</script>
