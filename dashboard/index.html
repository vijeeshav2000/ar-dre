<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Will Take the Iron Throne?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080d;
    --gold: #c5a059;
    --gold-light: #e5c178;
    --ice: #4fb3ff;
    --fire: #ff4520;
    --ice-glow: rgba(79,179,255,0.4);
    --fire-glow: rgba(255,69,32,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(79,179,255,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, rgba(255,69,32,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    padding: 40px 24px;
    text-align: center;
  }

  .sigil { font-size: 42px; letter-spacing: 12px; margin-bottom: 12px; }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: clamp(1.4em, 5vw, 2.2em);
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a8494;
    margin-bottom: 40px;
  }

  /* Score Panels */
  .scores {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 36px;
  }

  .score-card {
    flex: 1;
    max-width: 200px;
    padding: 28px 16px;
    border-radius: 16px;
    background: rgba(12,16,24,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    transition: box-shadow 0.4s;
  }

  .score-card.ice { box-shadow: 0 0 0 rgba(79,179,255,0); }
  .score-card.fire { box-shadow: 0 0 0 rgba(255,69,32,0); }
  .score-card.ice.active { box-shadow: 0 0 30px var(--ice-glow); border-color: rgba(79,179,255,0.3); }
  .score-card.fire.active { box-shadow: 0 0 30px var(--fire-glow); border-color: rgba(255,69,32,0.3); }

  .score-card .team-icon { font-size: 32px; margin-bottom: 8px; }
  .score-card .team-name {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #7a8494;
    margin-bottom: 4px;
  }
  .score-card .leader-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 14px;
  }
  .score-card.ice .leader-name { color: var(--ice); }
  .score-card.fire .leader-name { color: var(--fire); }

  .score-card .count {
    font-family: 'Cinzel Decorative', serif;
    font-size: 48px;
    font-weight: 900;
    line-height: 1;
  }
  .score-card.ice .count { color: var(--ice); }
  .score-card.fire .count { color: var(--fire); }

  .score-card .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5a6474;
    margin-top: 6px;
  }

  /* Throne Button */
  .throne-btn {
    display: inline-block;
    padding: 18px 36px;
    border: 2px solid var(--gold);
    border-radius: 12px;
    background: rgba(197,160,89,0.08);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 32px;
  }
  .throne-btn:hover {
    background: rgba(197,160,89,0.18);
    box-shadow: 0 0 30px rgba(197,160,89,0.2);
  }
  .throne-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Result Reveal */
  .result {
    display: none;
    padding: 32px 24px;
    border-radius: 16px;
    background: rgba(12,16,24,0.9);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    animation: revealFade 0.8s ease-out;
  }
  .result.show { display: block; }

  @keyframes revealFade {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .result .crown { font-size: 56px; margin-bottom: 10px; }
  .result .winner-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.2em, 4vw, 1.8em);
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .result.ice-wins .winner-title { color: var(--ice); }
  .result.fire-wins .winner-title { color: var(--fire); }
  .result.tie .winner-title { color: var(--gold); }

  .result.ice-wins { border-color: rgba(79,179,255,0.25); box-shadow: 0 0 40px var(--ice-glow); }
  .result.fire-wins { border-color: rgba(255,69,32,0.25); box-shadow: 0 0 40px var(--fire-glow); }
  .result.tie { border-color: rgba(197,160,89,0.25); box-shadow: 0 0 40px rgba(197,160,89,0.2); }

  .result .verdict {
    font-size: 13px;
    letter-spacing: 2px;
    color: #9aa5b5;
    line-height: 1.6;
  }

  /* Connection Status */
  .status {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #4a5464;
    transition: color 0.3s;
  }
  .status.connected { color: #3d9970; }
</style>
</head>
<body>

<div class="container">
  <div class="sigil">🐉⚔️🐉</div>
  <h1>The Great War</h1>
  <div class="subtitle">Realm Battle Tracker</div>

  <div class="scores">
    <div class="score-card ice" id="ice-card">
      <div class="team-icon">❄️🐉</div>
      <div class="team-name">The Night King</div>
      <div class="leader-name">VISERION</div>
      <div class="count" id="ice-count">0</div>
      <div class="label">collected</div>
    </div>
    <div class="score-card fire" id="fire-card">
      <div class="team-icon">🔥🐉</div>
      <div class="team-name">Daenerys</div>
      <div class="leader-name">DROGON</div>
      <div class="count" id="fire-count">0</div>
      <div class="label">collected</div>
    </div>
  </div>

  <button class="throne-btn" id="throne-btn" disabled>
    ⚔️ Who Will Take the Iron Throne? ⚔️
  </button>

  <div class="result" id="result">
    <div class="crown" id="result-crown"></div>
    <div class="winner-title" id="result-title"></div>
    <div class="verdict" id="result-verdict"></div>
  </div>
</div>

<div class="status" id="status">connecting to realm…</div>

<script>
(()=>{
  const iceCountEl = document.getElementById('ice-count')
  const fireCountEl = document.getElementById('fire-count')
  const iceCard = document.getElementById('ice-card')
  const fireCard = document.getElementById('fire-card')
  const throneBtn = document.getElementById('throne-btn')
  const resultEl = document.getElementById('result')
  const resultCrown = document.getElementById('result-crown')
  const resultTitle = document.getElementById('result-title')
  const resultVerdict = document.getElementById('result-verdict')
  const statusEl = document.getElementById('status')

  let iceScore = 0
  let fireScore = 0

  const updateScores = (ice, fire) => {
    if (ice > 0) {
      iceScore = ice
      iceCountEl.textContent = ice
      iceCard.classList.add('active')
    }
    if (fire > 0) {
      fireScore = fire
      fireCountEl.textContent = fire
      fireCard.classList.add('active')
    }
    // Enable button when at least one team has scored
    if (iceScore > 0 || fireScore > 0) {
      throneBtn.disabled = false
    }
  }

  throneBtn.addEventListener('click', () => {
    resultEl.classList.remove('show', 'ice-wins', 'fire-wins', 'tie')

    // Small delay for dramatic effect
    setTimeout(() => {
      if (iceScore > fireScore) {
        resultEl.classList.add('show', 'ice-wins')
        resultCrown.textContent = '❄️👑🐉'
        resultTitle.textContent = 'THE NIGHT KING TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Viserion's icy breath freezes the realm.<br>Ice ${iceScore} — Fire ${fireScore}`
      } else if (fireScore > iceScore) {
        resultEl.classList.add('show', 'fire-wins')
        resultCrown.textContent = '🔥👑🐉'
        resultTitle.textContent = 'DAENERYS TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Drogon's fire melts the Iron Throne and forges a new world.<br>Fire ${fireScore} — Ice ${iceScore}`
      } else {
        resultEl.classList.add('show', 'tie')
        resultCrown.textContent = '⚖️👑⚔️'
        resultTitle.textContent = 'THE REALM IS DIVIDED'
        resultVerdict.innerHTML = `Neither fire nor ice prevails. The war continues.<br>Ice ${iceScore} — Fire ${fireScore}`
      }
    }, 300)
  })

  // WebSocket auto-connect
  const params = new URLSearchParams(window.location.search)
  const relay = params.get('relay') || 'wss://score-relay.iceandfire.workers.dev'
  const room = params.get('room') || 'quantum1'

  let socket = null

  const connect = () => {
    const url = `${relay}/ws?room=${encodeURIComponent(room)}&name=dashboard&role=viewer`
    socket = new WebSocket(url)

    socket.addEventListener('open', () => {
      statusEl.textContent = `connected · room "${room}"`
      statusEl.className = 'status connected'
    })

    socket.addEventListener('close', () => {
      statusEl.textContent = 'disconnected · reconnecting…'
      statusEl.className = 'status'
      setTimeout(connect, 2000)
    })

    socket.addEventListener('error', () => {
      socket.close()
    })

    socket.addEventListener('message', (event) => {
      try {
        const msg = JSON.parse(event.data)
        console.log('WS received:', msg)

        // Handle relay broadcast format: {type:"state", scores: {Ice: {ice, fire}, Fire: {ice, fire}}}
        if (msg.type === 'state' && msg.scores) {
          let totalIce = 0, totalFire = 0
          Object.values(msg.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }

        // Handle relay broadcast format: {type:"state", players:[{name, ice, fire, total}]}
        if (msg.type === 'state' && msg.players) {
          let totalIce = 0, totalFire = 0
          msg.players.forEach(p => {
            totalIce += (p.ice || 0)
            totalFire += (p.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }

        // Handle direct player score: {type:"score", name:"Ice"/"Fire", ice:N, fire:N}
        if (msg.type === 'score') {
          updateScores(msg.ice || 0, msg.fire || 0)
        }

        // Handle any message with ice/fire fields (catch-all)
        if (typeof msg.ice === 'number' || typeof msg.fire === 'number') {
          updateScores(msg.ice || 0, msg.fire || 0)
        }
      } catch(e) {
        console.error('bad message', e)
      }
    })
  }

  connect()

  // 1-second background state polling fallback (guarantees real-time sync with 0 page refreshes)
  const httpRelay = relay.replace(/^ws:/, 'http:').replace(/^wss:/, 'https:')
  const pollState = async () => {
    try {
      const res = await fetch(`${httpRelay}/state?room=${encodeURIComponent(room)}`)
      if (res.ok) {
        const data = await res.json()
        if (data && data.scores) {
          let totalIce = 0, totalFire = 0
          Object.values(data.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }
      }
    } catch(e) {}
  }
  setInterval(pollState, 1000)
  pollState()
})()
</script>

</body>
</html>
