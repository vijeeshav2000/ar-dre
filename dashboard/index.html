<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Will Take the Iron Throne? — Live Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06080d;
    --gold: #c5a059;
    --gold-light: #e5c178;
    --ice: #4fb3ff;
    --fire: #ff4520;
    --ice-glow: rgba(79,179,255,0.5);
    --fire-glow: rgba(255,69,32,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Cinzel', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Fullscreen particle FX canvas */
  #fx-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 99;
  }

  /* Atmospheric Background Effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(79,179,255,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, rgba(255,69,32,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Screen shake animation */
  .screen-shake {
    animation: shakeAnim 0.8s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10%, 30%, 50%, 70%, 90% { transform: translate(-6px, 4px) rotate(-0.5deg); }
    20%, 40%, 60%, 80% { transform: translate(6px, -4px) rotate(0.5deg); }
  }

  /* Blinding flash overlay */
  #flash-overlay {
    position: fixed;
    inset: 0;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.1s ease-out;
  }
  #flash-overlay.flash {
    opacity: 0.85;
    transition: opacity 0.8s ease-out;
  }
  #flash-overlay.flash-ice {
    background: radial-gradient(circle, #c8e8ff 0%, #4fb3ff 60%, transparent 100%);
  }
  #flash-overlay.flash-fire {
    background: radial-gradient(circle, #ffeedd 0%, #ff4520 60%, transparent 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    padding: 36px 20px;
    text-align: center;
  }

  .sigil {
    font-size: 42px;
    letter-spacing: 12px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 16px rgba(197,160,89,0.4));
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-weight: 900;
    font-size: clamp(1.5em, 5.5vw, 2.3em);
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(197,160,89,0.3);
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7a8494;
    margin-bottom: 36px;
  }

  /* Score Panels */
  .scores {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .score-card {
    flex: 1;
    max-width: 210px;
    padding: 26px 14px;
    border-radius: 18px;
    background: rgba(12,16,24,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .score-card.ice.active {
    box-shadow: 0 0 35px var(--ice-glow);
    border-color: rgba(79,179,255,0.5);
    transform: translateY(-3px);
  }
  .score-card.fire.active {
    box-shadow: 0 0 35px var(--fire-glow);
    border-color: rgba(255,69,32,0.5);
    transform: translateY(-3px);
  }

  .score-card .team-icon { font-size: 34px; margin-bottom: 8px; }
  .score-card .team-name {
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #7a8494;
    margin-bottom: 4px;
  }
  .score-card .leader-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }
  .score-card.ice .leader-name { color: var(--ice); }
  .score-card.fire .leader-name { color: var(--fire); }

  .score-card .count {
    font-family: 'Cinzel Decorative', serif;
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .score-card.ice .count { color: var(--ice); text-shadow: 0 0 20px var(--ice-glow); }
  .score-card.fire .count { color: var(--fire); text-shadow: 0 0 20px var(--fire-glow); }

  .score-card .label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5a6474;
    margin-top: 6px;
  }

  /* Throne Button */
  .throne-btn {
    display: inline-block;
    padding: 18px 36px;
    border: 2px solid var(--gold);
    border-radius: 14px;
    background: rgba(197,160,89,0.08);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(13px, 3vw, 15px);
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .throne-btn:hover:not(:disabled) {
    background: rgba(197,160,89,0.22);
    box-shadow: 0 0 35px rgba(197,160,89,0.4);
    transform: scale(1.02);
  }
  .throne-btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .throne-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    border-color: rgba(197,160,89,0.2);
  }
  .throne-btn.pulsing {
    animation: btnPulse 0.5s infinite alternate;
  }
  @keyframes btnPulse {
    from { box-shadow: 0 0 15px rgba(197,160,89,0.3); }
    to { box-shadow: 0 0 40px rgba(197,160,89,0.8); }
  }

  /* Result Reveal */
  .result {
    display: none;
    padding: 36px 22px;
    border-radius: 18px;
    background: rgba(10,14,22,0.92);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    position: relative;
  }
  .result.show {
    display: block;
    animation: revealDramatic 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes revealDramatic {
    0% {
      opacity: 0;
      transform: translateY(30px) scale(0.85);
      filter: blur(10px);
    }
    50% {
      filter: blur(0px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }
  }

  .result .crown {
    font-size: 60px;
    margin-bottom: 12px;
    display: inline-block;
    animation: crownPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 0.2s;
  }

  @keyframes crownPop {
    0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
    70% { transform: scale(1.25) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .result .winner-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.2em, 4vw, 1.8em);
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 10px;
    line-height: 1.3;
  }
  .result.ice-wins .winner-title { color: var(--ice); text-shadow: 0 0 25px var(--ice-glow); }
  .result.fire-wins .winner-title { color: var(--fire); text-shadow: 0 0 25px var(--fire-glow); }
  .result.tie .winner-title { color: var(--gold); text-shadow: 0 0 25px rgba(197,160,89,0.5); }

  .result.ice-wins { border-color: rgba(79,179,255,0.4); box-shadow: 0 0 50px var(--ice-glow); }
  .result.fire-wins { border-color: rgba(255,69,32,0.4); box-shadow: 0 0 50px var(--fire-glow); }
  .result.tie { border-color: rgba(197,160,89,0.4); box-shadow: 0 0 50px rgba(197,160,89,0.3); }

  .result .verdict {
    font-size: 13px;
    letter-spacing: 2px;
    color: #a0aec0;
    line-height: 1.6;
    margin-top: 8px;
  }

  /* Suspense Banner */
  #suspense-banner {
    display: none;
    font-family: 'Cinzel Decorative', serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--gold-light);
    margin-bottom: 24px;
    animation: suspensePulse 0.4s infinite alternate;
  }
  @keyframes suspensePulse {
    from { opacity: 0.6; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1.02); }
  }

  /* Connection Status */
  .status {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #4a5464;
    transition: color 0.3s;
    white-space: nowrap;
    z-index: 10;
  }
  .status.connected { color: #3d9970; }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>
<div id="flash-overlay"></div>

<div class="container" id="main-container">
  <div class="sigil">🐉⚔️🐉</div>
  <h1>A Song of Ice and Fire</h1>
  <div class="subtitle">Realm Battle Tracker</div>

  <div class="scores">
    <div class="score-card ice" id="ice-card">
      <div class="team-icon">❄️🐉</div>
      <div class="team-name">The Night King</div>
      <div class="leader-name">VISERION</div>
      <div class="count" id="ice-count">0</div>
      <div class="label">collected</div>
    </div>
    <div class="score-card fire" id="fire-card">
      <div class="team-icon">🔥🐉</div>
      <div class="team-name">Daenerys</div>
      <div class="leader-name">DROGON</div>
      <div class="count" id="fire-count">0</div>
      <div class="label">collected</div>
    </div>
  </div>

  <div id="suspense-banner">⚔️ SUMMONING THE IRON THRONE... ⚔️</div>

  <button class="throne-btn" id="throne-btn" disabled>
    ⚔️ Who Will Take the Iron Throne? ⚔️
  </button>

  <div class="result" id="result">
    <div class="crown" id="result-crown"></div>
    <div class="winner-title" id="result-title"></div>
    <div class="verdict" id="result-verdict"></div>
  </div>
</div>

<div class="status" id="status">connecting to realm…</div>

<script>
(()=>{
  const iceCountEl = document.getElementById('ice-count')
  const fireCountEl = document.getElementById('fire-count')
  const iceCard = document.getElementById('ice-card')
  const fireCard = document.getElementById('fire-card')
  const throneBtn = document.getElementById('throne-btn')
  const resultEl = document.getElementById('result')
  const resultCrown = document.getElementById('result-crown')
  const resultTitle = document.getElementById('result-title')
  const resultVerdict = document.getElementById('result-verdict')
  const statusEl = document.getElementById('status')
  const mainContainer = document.getElementById('main-container')
  const flashOverlay = document.getElementById('flash-overlay')
  const suspenseBanner = document.getElementById('suspense-banner')
  const fxCanvas = document.getElementById('fx-canvas')
  const ctx = fxCanvas.getContext('2d')

  let iceScore = 0
  let fireScore = 0
  let particles = []
  let animId = null

  // Resize particle canvas
  const resizeCanvas = () => {
    fxCanvas.width = window.innerWidth
    fxCanvas.height = window.innerHeight
  }
  window.addEventListener('resize', resizeCanvas)
  resizeCanvas()

  // Audio: Official Game of Thrones Theme Track
  const themeAudio = new Audio('assets/got-theme.mp3')
  themeAudio.preload = 'auto'
  themeAudio.volume = 1.0

  const playGotThemeAudio = () => {
    try {
      themeAudio.currentTime = 0
      const playPromise = themeAudio.play()
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log('Audio playback waiting for user gesture or loading:', err)
        })
      }
    } catch(e) {
      console.error('Audio play error:', e)
    }
  }

  // Particle explosion logic
  const spawnParticles = (type) => {
    const cx = window.innerWidth / 2
    const cy = window.innerHeight / 2
    particles = []

    const count = 180
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2
      const speed = 2 + Math.random() * 12
      const size = 3 + Math.random() * 8
      const life = 60 + Math.random() * 60

      let color
      if (type === 'ice') {
        const blues = ['#4fb3ff', '#a0dcff', '#ffffff', '#70c5ff', '#1f70b0']
        color = blues[Math.floor(Math.random() * blues.length)]
      } else if (type === 'fire') {
        const reds = ['#ff4520', '#ff825a', '#ffcc00', '#ffffff', '#d43000']
        color = reds[Math.floor(Math.random() * reds.length)]
      } else {
        const golds = ['#c5a059', '#e5c178', '#4fb3ff', '#ff4520', '#ffffff']
        color = golds[Math.floor(Math.random() * golds.length)]
      }

      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - (type === 'fire' ? 1.5 : 0),
        size,
        color,
        life,
        maxLife: life,
        spin: (Math.random() - 0.5) * 0.2
      })
    }

    if (!animId) loopParticles()
  }

  const loopParticles = () => {
    ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height)
    let alive = 0

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i]
      if (p.life > 0) {
        p.x += p.vx
        p.y += p.vy
        p.vx *= 0.98
        p.vy *= 0.98
        p.life--
        const alpha = p.life / p.maxLife

        ctx.save()
        ctx.globalAlpha = alpha
        ctx.fillStyle = p.color
        ctx.shadowColor = p.color
        ctx.shadowBlur = 10

        ctx.beginPath()
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2)
        ctx.fill()
        ctx.restore()

        alive++
      }
    }

    if (alive > 0) {
      animId = requestAnimationFrame(loopParticles)
    } else {
      animId = null
      ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height)
    }
  }

  const updateScores = (ice, fire) => {
    iceScore = ice
    iceCountEl.textContent = ice
    if (ice > 0) {
      iceCard.classList.add('active')
    } else {
      iceCard.classList.remove('active')
    }

    fireScore = fire
    fireCountEl.textContent = fire
    if (fire > 0) {
      fireCard.classList.add('active')
    } else {
      fireCard.classList.remove('active')
    }

    // Enable button when at least one team has scored
    throneBtn.disabled = !(iceScore > 0 || fireScore > 0)
  }

  throneBtn.addEventListener('click', () => {
    const finalIce = iceScore
    const finalFire = fireScore
    const winnerType = finalIce > finalFire ? 'ice' : (finalFire > finalIce ? 'fire' : 'tie')

    // 1. Play official Game of Thrones theme track directly
    playGotThemeAudio()

    // 2. Trigger screen shake
    document.body.classList.remove('screen-shake')
    void document.body.offsetWidth // reflow
    document.body.classList.add('screen-shake')

    // 3. Trigger flash overlay
    flashOverlay.className = `flash flash-${winnerType}`
    setTimeout(() => { flashOverlay.className = '' }, 500)

    // 4. Trigger particle explosion
    spawnParticles(winnerType)

    // 5. Hide button & show suspense teaser banner
    throneBtn.style.display = 'none'
    suspenseBanner.style.display = 'block'
    resultEl.classList.remove('show', 'ice-wins', 'fire-wins', 'tie')

    // 6. Reveal victor after 1 second of dramatic suspense
    setTimeout(() => {
      suspenseBanner.style.display = 'none'
      throneBtn.style.display = 'inline-block'

      if (winnerType === 'ice') {
        resultEl.classList.add('show', 'ice-wins')
        resultCrown.textContent = '❄️👑🐉'
        resultTitle.textContent = 'THE NIGHT KING TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Viserion's icy blizzard freezes the realm.<br>Ice ${finalIce} — Fire ${finalFire}`
      } else if (winnerType === 'fire') {
        resultEl.classList.add('show', 'fire-wins')
        resultCrown.textContent = '🔥👑🐉'
        resultTitle.textContent = 'DAENERYS TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Drogon's inferno melts the Iron Throne and creates a new dynasty.<br>Fire ${finalFire} — Ice ${finalIce}`
      } else {
        resultEl.classList.add('show', 'tie')
        resultCrown.textContent = '⚔️⚖️🛡️'
        resultTitle.textContent = 'NO ONE TAKES THE IRON THRONE'
        resultVerdict.innerHTML = `Fire and Ice have clashed to an exact standstill.<br>Ice ${finalIce} — Fire ${finalFire}<br><span style="color:var(--gold);font-weight:700;letter-spacing:1.5px;display:inline-block;margin-top:6px">THE IRON THRONE STANDS EMPTY</span>`
      }

      // Reset counters to zero immediately
      updateScores(0, 0)

      // Notify relay server to reset all stored scores to zero for the next battle
      try {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'reset' }))
        }
        fetch(`${httpRelay}/reset?room=${encodeURIComponent(room)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          mode: 'cors'
        }).catch(() => {})
      } catch(e) {}
    }, 1000)
  })

  // WebSocket auto-connect
  const params = new URLSearchParams(window.location.search)
  const relay = params.get('relay') || 'wss://score-relay.iceandfire.workers.dev'
  const room = params.get('room') || 'quantum1'

  let socket = null

  const connect = () => {
    const url = `${relay}/ws?room=${encodeURIComponent(room)}&name=dashboard&role=viewer`
    socket = new WebSocket(url)

    socket.addEventListener('open', () => {
      statusEl.textContent = `connected · room "${room}"`
      statusEl.className = 'status connected'
    })

    socket.addEventListener('close', () => {
      statusEl.textContent = 'disconnected · reconnecting…'
      statusEl.className = 'status'
      setTimeout(connect, 2000)
    })

    socket.addEventListener('error', () => {
      socket.close()
    })

    socket.addEventListener('message', (event) => {
      try {
        const msg = JSON.parse(event.data)
        console.log('WS received:', msg)

        // Handle relay broadcast format: {type:"state", scores: {Ice: {ice, fire}, Fire: {ice, fire}}}
        if (msg.type === 'state' && msg.scores) {
          let totalIce = 0, totalFire = 0
          Object.values(msg.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }

        // Handle relay broadcast format: {type:"state", players:[{name, ice, fire, total}]}
        if (msg.type === 'state' && msg.players) {
          let totalIce = 0, totalFire = 0
          msg.players.forEach(p => {
            totalIce += (p.ice || 0)
            totalFire += (p.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }

        // Handle direct player score: {type:"score", name:"Ice"/"Fire", ice:N, fire:N}
        if (msg.type === 'score') {
          updateScores(msg.ice || 0, msg.fire || 0)
        }

        // Handle any message with ice/fire fields (catch-all)
        if (typeof msg.ice === 'number' || typeof msg.fire === 'number') {
          updateScores(msg.ice || 0, msg.fire || 0)
        }
      } catch(e) {
        console.error('bad message', e)
      }
    })
  }

  connect()

  // 1-second background state polling fallback (guarantees real-time sync with 0 page refreshes)
  const httpRelay = relay.replace(/^ws:/, 'http:').replace(/^wss:/, 'https:')
  const pollState = async () => {
    try {
      const res = await fetch(`${httpRelay}/state?room=${encodeURIComponent(room)}`)
      if (res.ok) {
        const data = await res.json()
        if (data && data.scores) {
          let totalIce = 0, totalFire = 0
          Object.values(data.scores).forEach(s => {
            totalIce += (s.ice || 0)
            totalFire += (s.fire || 0)
          })
          updateScores(totalIce, totalFire)
        }
      }
    } catch(e) {}
  }
  setInterval(pollState, 1000)
  pollState()
})()
</script>

</body>
</html>
